<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Manager</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; color: #333; }
        h1 { color: #2c3e50; }
        .controls { margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
        button { padding: 10px 15px; border: none; border-radius: 4px; background-color: #3498db; color: white; cursor: pointer; font-size: 14px; }
        button:hover { background-color: #2980b9; }
        .btn-reset { background-color: #e74c3c; }
        .btn-reset:hover { background-color: #c0392b; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f1f2f6; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .instock { background-color: #2ecc71; color: white; }
        .outstock { background-color: #e74c3c; color: white; }
        .tag { background: #dfe4ea; border-radius: 4px; padding: 2px 6px; margin-right: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <h1>Product Inventory Manager</h1>
    
    <div class="controls">
        <button id="btn-all">Show All Products</button>
        <button id="btn-available">Filter In-Stock Only</button>
        <button id="btn-discount">Apply 15% Bulk Discount</button>
        <button id="btn-reset" class="btn-reset">Reset Inventory</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Discounted Price</th>
                <th>Status</th>
                <th>Tags</th>
            </tr>
        </thead>
        <tbody id="inventory-table-body">
            <!-- Dynamic rows will be inserted here by TypeScript -->
        </tbody>
    </table>

    <!-- Load the compiled JavaScript file -->
    <script src="dist/app.js" defer></script>
</body>
</html>
